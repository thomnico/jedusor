[package]
name = "jedusor"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Nicolas Thomas"]
description = "Stylus-first AI interaction layer for reMarkable tablets"
license = "MIT"

[[bin]]
name = "jedusor"
path = "src/main.rs"

[dependencies]
# reMarkable device framework (Linux only)
libremarkable = { version = "0.7", optional = true }

# GUI simulator for macOS/desktop development
minifb = { version = "0.27", optional = true }
image = { version = "0.25", optional = true }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client for APIs
reqwest = { version = "0.11", features = ["json", "stream"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# PDF support (for future Document Mode)
lopdf = { version = "0.32", optional = true }

# Environment variables
dotenv = "0.15"

[features]
# Default features for cross-compilation to reMarkable
default = ["device"]
# Device features (requires Linux target)
device = ["libremarkable"]
# Simulator for macOS/desktop development
simulator = ["minifb", "image"]
# PDF support (for future Document Mode)
pdf = ["lopdf"]

[profile.release]
# Optimize for reMarkable performance
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
# Faster compilation during development
opt-level = 1
